services:
  - type: web
    name: gangdong-running
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:web
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TZ
        value: Asia/Seoul
      - key: NODE_VERSION
        value: "20"
