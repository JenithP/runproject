[build]
  command = "npm install && npm run build:web"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # 번들링이 까다로운 패키지는 그대로 포함
  external_node_modules = ["firebase-admin", "telegraf", "@google/genai"]

# 관리자 API → api 함수 (event.path 접두어는 함수에서 제거)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# 텔레그램 webhook → api 함수
[[redirects]]
  from = "/telegram-webhook"
  to = "/.netlify/functions/api/telegram-webhook"
  status = 200

# 그 외 모든 경로 → React SPA (위 규칙에 안 걸린 것만)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
